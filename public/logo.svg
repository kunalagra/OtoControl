<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- ShadCN Dark Theme Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Headphone Arch Gradient (Cyan to Blue) -->
    <linearGradient id="headbandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Soundwave & Pulse Glow Gradient (Cyan to Emerald) -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Earcup Shadow Fill -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="centerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4" />

  <!-- Outer Soundwaves -->
  <path d="M 80 260 A 130 130 0 0 0 80 340" fill="none" stroke="url(#cyanGlow)" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  <path d="M 60 240 A 160 160 0 0 0 60 360" fill="none" stroke="url(#cyanGlow)" stroke-width="5" stroke-linecap="round" opacity="0.2" />

  <path d="M 432 260 A 130 130 0 0 1 432 340" fill="none" stroke="url(#cyanGlow)" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  <path d="M 452 240 A 160 160 0 0 1 452 360" fill="none" stroke="url(#cyanGlow)" stroke-width="5" stroke-linecap="round" opacity="0.2" />

  <!-- Perfectly Vertically & Horizontally Centered Headphone Arch -->
  <path d="M 136 300 V 250 C 136 178 190 138 256 138 C 322 138 376 178 376 250 V 300" 
        fill="none" 
        stroke="url(#headbandGrad)" 
        stroke-width="26" 
        stroke-linecap="round" />

  <!-- Ear Cups (Left inner edge: X=162, Right inner edge: X=350) -->
  <rect x="110" y="240" width="52" height="120" rx="26" fill="url(#cupGrad)" stroke="url(#headbandGrad)" stroke-width="6" />
  <rect x="350" y="240" width="52" height="120" rx="26" fill="url(#cupGrad)" stroke="url(#headbandGrad)" stroke-width="6" />

  <!-- Clean Digital Pulse Line with Clean Breathing Room (Starts X=172, Ends X=340, NO Overlap) -->
  <g filter="url(#centerGlow)">
    <path d="M 172 300 
             H 194 
             V 264 
             H 215 
             V 336 
             H 236 
             V 254 
             H 256 
             V 346 
             H 276 
             V 264 
             H 297 
             V 336 
             H 320 
             V 300 
             H 340" 
          fill="none" 
          stroke="url(#cyanGlow)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
